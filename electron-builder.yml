appId: com.bossai.funding
productName: BossAI Funding
copyright: Copyright (c) 2026 BossAI
electronVersion: 43.4.1
asar: true
directories:
  output: out/desktop
files:
  - desktop/**/*
  - dist/**/*
  - package.json
  - LICENSE
  - COMMERCIAL_LICENSE.md
  - README.md
  - NOTICE.md
win:
  icon: out/desktop-assets/bossai-funding.ico
  legalTrademarks: BossAI
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
  artifactName: BossAI-Funding-Setup-${version}-${arch}.${ext}
nsis:
  installerIcon: out/desktop-assets/bossai-funding.ico
  uninstallerIcon: out/desktop-assets/bossai-funding.ico
  installerHeaderIcon: out/desktop-assets/bossai-funding.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BossAI Funding
  deleteAppDataOnUninstall: false
